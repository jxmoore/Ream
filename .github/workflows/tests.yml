name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    # Ream is a WPF app and its tests host real WPF views, so this needs Windows.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Ream.sln

      - name: Build
        run: dotnet build Ream.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Ream.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
